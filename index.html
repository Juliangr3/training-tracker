              const ms=monStart(date);
              const isFirstOfWeek=weekGroups[ms]===date;
              const isExp=expandedDate===date;
              const working=list.filter(e=>!e.warmup);
              const vol=working.reduce((a,e)=>a+(parseInt(e.sets)||0)*(parseInt(e.reps)||0)*(parseFloat(e.weight)||0),0);
              const hasPR=list.some(e=>e.pr);
              return(
                <div key={date} style={{marginBottom:10}}>
                  <div className="date-group-row" onClick={()=>setExpandedDate(isExp?null:date)}
                    style={{background:"#111",border:"1px solid #1a1815",borderRadius:isExp?"8px 8px 0 0":8,padding:"14px 20px",display:"grid",gridTemplateColumns:"1fr auto auto auto auto auto",gap:12,alignItems:"center"}}>
                    <div>
                      <div style={{fontSize:13,color:"#e8e0d5"}}>
                        {fmtDow(date)}, {fmtDate(date)}
                        {date===today&&<span style={{marginLeft:10,fontSize:9,color:"#e8c84a",letterSpacing:2}}>TODAY</span>}
                      </div>
                      <div style={{fontSize:10,color:"#3a3530",marginTop:2}}>{isoWeek(date)} · {list.length} exercise{list.length!==1?"s":""}</div>
                    </div>
                    {cardio[date]&&<span title="Cardio done" style={{fontSize:14}}>🏃</span>}
                    {hasPR&&<span style={{fontSize:14}}>🏆</span>}
                    {vol>0&&<span style={{fontSize:11,color:"#5a5550"}}>{Math.round(vol).toLocaleString()} kg vol</span>}
                    <span style={{fontSize:11,color:"#4a4540"}}>{working.reduce((a,e)=>a+(parseInt(e.sets)||0),0)} sets</span>
                    <span style={{fontSize:14,color:"#3a3530"}}>{isExp?"▴":"▾"}</span>
                  </div>
                  {isFirstOfWeek&&(
                    <div style={{padding:"8px 20px",borderTop:"1px solid #141210",background:"#0e0e0b",display:"flex",alignItems:"center",gap:10}}>
                      <span style={{fontSize:9,color:"#3a3530",letterSpacing:2}}>{isoWeek(date)}</span>
                      <button onClick={e=>{e.stopPropagation();generateObsidian(ms)}}
                        style={{fontSize:9,letterSpacing:2,padding:"4px 12px",borderRadius:3,cursor:"pointer",border:"1px solid #2a4a2a",background:"transparent",color:"#4a7a4a"}}
                        onMouseEnter={e=>{e.currentTarget.style.borderColor="#4a9a4a";e.currentTarget.style.color="#70c870"}}
                        onMouseLeave={e=>{e.currentTarget.style.borderColor="#2a4a2a";e.currentTarget.style.color="#4a7a4a"}}>
                        ↓ OBSIDIAN WEEK
                      </button>
                    </div>
                  )}
                  {isExp&&(
                    <div style={{background:"#0e0e0c",border:"1px solid #1a1815",borderTop:"none",borderRadius:"0 0 8px 8px",padding:"16px 18px"}}>
                      {[...new Set(list.map(e=>e.exercise))].map(exName=>{
                        const exEntries=list.filter(e=>e.exercise===exName).sort((a,b)=>(a.setNumber||0)-(b.setNumber||0));
                        return(
                          <div key={exName} style={{marginBottom:12}}>
                            <div style={{fontSize:11,color:"#8a8075",letterSpacing:1,marginBottom:5,paddingBottom:4,borderBottom:"1px solid #161410"}}>{exName}</div>
                            {exEntries.map(e=>(
                              <div key={e.id} style={{display:"grid",gridTemplateColumns:"28px 60px 80px 70px 1fr",gap:8,padding:"4px 0",alignItems:"center"}}>
                                <span style={{fontSize:10,color:e.warmup?"#7a6030":"#3a3530",textAlign:"center"}}>{e.warmup?"W":e.setNumber||"—"}</span>
                                <span style={{fontSize:12,color:e.warmup?"#7a6030":"#c8c0b5"}}>{e.reps}× reps</span>
                                <span style={{fontSize:12,color:e.warmup?"#8a7040":"#e8c84a",fontFamily:"'Bebas Neue',sans-serif",letterSpacing:.5}}>{e.weight?`${e.weight} kg`:"—"}</span>
                                <span style={{fontSize:10,color:"#4a4540"}}>{e.restAfterSec?`${e.restAfterSec}s rest`:""}</span>
                                <span style={{fontSize:10,color:"#4a4540"}}>{e.pr?"🏆":""}{e.notes&&!e.warmup?` "${e.notes}"`:""}</span>
                              </div>
                            ))}
                          </div>
                        );
                      })}
                      {cardio[date]&&<div style={{fontSize:11,color:"#4a7a4a",paddingTop:8,borderTop:"1px solid #161410",marginTop:4}}>🏃 Cardio completed</div>}
                    </div>
                  )}
                </div>
              );
              });
            })()
          }
        </>}

        {/* ═══ DASHBOARD ═══ */}
        {view==="dashboard"&&<>
          <div style={{marginTop:28,marginBottom:6,fontFamily:"'Bebas Neue',sans-serif",fontSize:30,letterSpacing:2,color:"#fff"}}>DASHBOARD</div>
          <div style={{fontSize:11,color:"#3a3530",marginBottom:24}}>{todayIsoWk} · {fmtDate(thisMonStart)} — {fmtDate(thisWeekEnd)}</div>
          {entries.length===0
            ?<div style={{textAlign:"center",color:"#2a2820",fontSize:12,letterSpacing:3,padding:"48px 0"}}>LOG WORKOUTS TO SEE YOUR STATS</div>
            :<>
              <div style={{fontSize:10,letterSpacing:3,color:"#3a3530",marginBottom:14}}>THIS WEEK</div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:12,marginBottom:32}}>
                {[
                  {label:"TOTAL VOLUME",val:curStat.vol.toLocaleString(),unit:"kg",delta:prevStat?pct(curStat.vol,prevStat.vol):null,deltaUnit:"%",sub:prevStat?`prev ${prevStat.vol.toLocaleString()} kg`:"no prior week"},
                  {label:"WORKING SETS", val:curStat.totalSets,unit:"sets",delta:prevStat?curStat.totalSets-prevStat.totalSets:null,deltaUnit:"",sub:prevStat?`prev ${prevStat.totalSets}`:"no prior week"},
                  {label:"EXERCISES",   val:curStat.totalEx,unit:"logged",delta:prevStat?pct(curStat.totalEx,prevStat.totalEx):null,deltaUnit:"%",sub:prevStat?`prev ${prevStat.totalEx}`:"no prior week"},
                  {label:"DAYS ACTIVE", val:curStat.activeDays,unit:"/ 7",delta:prevStat?curStat.activeDays-prevStat.activeDays:null,deltaUnit:" days",sub:prevStat?`prev ${prevStat.activeDays} days`:"no prior week"},
                ].map(({label,val,unit,delta,deltaUnit,sub})=>(
                  <div key={label} className="top-stat">
                    <div style={{fontSize:9,letterSpacing:3,color:"#3a3530",marginBottom:10}}>{label}</div>
                    <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:32,color:"#e8c84a",letterSpacing:1,lineHeight:1,marginBottom:4}}>{val}<span style={{fontSize:14,color:"#5a5550"}}> {unit}</span></div>
                    {delta!==null&&<DeltaBadge val={delta} unit={deltaUnit}/>}
                    <div style={{fontSize:10,color:"#3a3530",marginTop:5}}>{sub}</div>
                  </div>
                ))}
              </div>
              {curStat.prs>0&&(
                <div style={{background:"#13100a",border:"1px solid #3a3010",borderRadius:8,padding:"14px 20px",marginBottom:32,display:"flex",alignItems:"center",gap:14}}>
                  <span style={{fontSize:24}}>🏆</span>
                  <div>
                    <div style={{fontSize:12,color:"#e8c84a",letterSpacing:1}}>{curStat.prs} PR{curStat.prs!==1?"S":""} THIS WEEK</div>
                    <div style={{fontSize:11,color:"#5a5040",marginTop:3}}>{entries.filter(e=>e.date>=thisMonStart&&e.date<=thisWeekEnd&&e.pr).map(e=>e.exercise).join(" · ")}</div>
                  </div>
                </div>
              )}
              {/* ── Strength Goal Trackers ── */}
              <div style={{marginTop:8}}>
                <div style={{fontSize:10,letterSpacing:3,color:"#3a3530",marginBottom:16}}>STRENGTH GOALS</div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(1,1fr)",gap:14}}>
                  {Object.entries(STRENGTH_GOALS).map(([exName,cfg])=>{
                    // All-time personal best for this exercise (working sets only)
                    const allW=entries.filter(e=>e.exercise===exName&&!e.warmup).map(e=>parseFloat(e.weight)||0).filter(w=>w>0);
                    const pb=allW.length?Math.max(...allW):0;
                    const pct=pb>0?Math.min(Math.round((pb/cfg.goal)*100),100):0;
                    const kgLeft=Math.max(+(cfg.goal-pb).toFixed(1),0);

                    // Monthly peak for the last 6 months
                    const monthPeaks=(()=>{
                      const now=new Date(todaySyd()+"T00:00:00");
                      const result=[];
                      for(let m=5;m>=0;m--){
                        const d=new Date(now.getFullYear(),now.getMonth()-m,1);
                        const ym=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
                        const monEntries=entries.filter(e=>e.exercise===exName&&!e.warmup&&e.date.slice(0,7)===ym);
                        const peak=monEntries.length?Math.max(...monEntries.map(e=>parseFloat(e.weight)||0)):null;
                        result.push({ym,peak,label:d.toLocaleDateString("en-AU",{month:"short"})});
                      }
                      return result;
                    })();
                    const maxMonPeak=Math.max(...monthPeaks.map(m=>m.peak||0),1);
                    const hasTrend=monthPeaks.some(m=>m.peak);

                    return(
                      <div key={exName} style={{background:"#111",border:"1px solid #1a1815",borderRadius:8,padding:"20px 22px"}}>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:16,flexWrap:"wrap",gap:8}}>
                          <div>
                            <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:22,color:"#fff",letterSpacing:1,lineHeight:1}}>{cfg.label}</div>
                            <div style={{fontSize:10,color:"#4a4540",marginTop:3}}>{exName}</div>
                          </div>
                          <div style={{textAlign:"right"}}>
                            {pb>0
                              ?<><div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:32,color:cfg.color,letterSpacing:1,lineHeight:1}}>{pb}<span style={{fontSize:14,color:"#5a5550"}}> kg</span></div>
                                <div style={{fontSize:10,color:"#4a4540",marginTop:2}}>personal best</div></>
                              :<div style={{fontSize:12,color:"#3a3530"}}>no data yet</div>
                            }
                          </div>
                        </div>

                        {/* Progress bar */}
                        <div style={{marginBottom:12}}>
                          <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"#4a4540",marginBottom:6}}>
                            <span>0 kg</span>
                            <span style={{color:cfg.color,fontWeight:700}}>{pct}% of goal</span>
                            <span>Goal: {cfg.goal} kg</span>
                          </div>
                          <div style={{height:8,background:"#1a1815",borderRadius:4,overflow:"hidden",position:"relative"}}>
                            <div style={{height:"100%",width:`${pct}%`,background:`linear-gradient(90deg,${cfg.color}88,${cfg.color})`,borderRadius:4,transition:"width .4s ease"}}/>
                          </div>
                          <div style={{fontSize:10,color:"#3a3530",marginTop:5,textAlign:"right"}}>{kgLeft>0?`${kgLeft} kg to go`:"🏆 Goal reached!"}</div>
                        </div>

                        {/* 6-month trend sparkline */}
                        {hasTrend&&(
                          <div>
                            <div style={{fontSize:9,letterSpacing:2,color:"#2a2820",marginBottom:6}}>6-MONTH TREND</div>
                            <div style={{display:"flex",gap:4,alignItems:"flex-end",height:36}}>
                              {monthPeaks.map((m,i)=>(
                                <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
                                  <div title={m.peak?`${m.ym}: ${m.peak}kg`:"no data"}
                                    style={{width:"100%",height:m.peak?`${Math.round((m.peak/maxMonPeak)*100)}%`:"4px",minHeight:4,background:m.peak?cfg.color:"#2a2820",borderRadius:"2px 2px 0 0",opacity:m.peak?1:0.3,transition:"height .3s"}}/>
                                  <div style={{fontSize:8,color:"#3a3530",whiteSpace:"nowrap"}}>{m.label}</div>
                                </div>
                              ))}
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            </>
          }
        </>}

        {/* ═══ PROGRESSION ═══ */}
        {view==="progression"&&<>
          <div style={{marginTop:28,marginBottom:20,fontFamily:"'Bebas Neue',sans-serif",fontSize:30,letterSpacing:2,color:"#fff"}}>PROGRESSIVE OVERLOAD</div>

          {allStalled&&(
            <div style={{background:"#1a0808",border:"2px solid #8b2222",borderRadius:8,padding:"18px 22px",marginBottom:24,display:"flex",gap:16,alignItems:"flex-start"}}>
              <div style={{fontSize:28,lineHeight:1}}>🚨</div>
              <div>
                <div style={{fontSize:15,color:"#ff6060",letterSpacing:1,fontFamily:"'Bebas Neue',sans-serif",marginBottom:4}}>ALL THREE LIFTS HAVE STALLED</div>
                <div style={{fontSize:12,color:"#c07070",lineHeight:1.6}}>All three lifts have stalled. Consider completing this phase and moving on.</div>
                {canComplete&&<button onClick={()=>setCompleteModal(true)}
                  style={{marginTop:12,background:"#8b2222",border:"none",color:"#fff",padding:"8px 18px",borderRadius:4,fontSize:11,letterSpacing:2,cursor:"pointer",fontWeight:700}}>
                  COMPLETE PHASE {curPhaseObj.id} →
                </button>}
              </div>
            </div>
          )}

          {/* Phase selector */}
          <div style={{background:"#111",border:"1px solid #1a1815",borderRadius:8,padding:20,marginBottom:24}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:18,flexWrap:"wrap",gap:12}}>
              <div>
                <div style={{fontSize:9,letterSpacing:3,color:"#3a3530",marginBottom:6}}>CURRENT PHASE</div>
                <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:28,color:"#e8c84a",letterSpacing:2,lineHeight:1,marginBottom:4}}>PHASE {curPhaseObj.id}: {curPhaseObj.name}</div>
                <div style={{fontSize:11,color:"#5a5550"}}>{curPhaseObj.description}</div>
              </div>
              <div style={{textAlign:"right"}}>
                <div style={{fontSize:9,letterSpacing:3,color:"#3a3530",marginBottom:4}}>WEEKS IN PHASE</div>
                <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:36,color:canComplete?"#e8c84a":"#c87820",letterSpacing:2,lineHeight:1}}>{weeksInPhase}</div>
                {phaseState.phaseStartDate&&<div style={{fontSize:10,color:"#3a3530",marginTop:3}}>since {fmtDateShort(phaseState.phaseStartDate)}</div>}
                {!canComplete&&<div style={{fontSize:10,color:"#7a5030",marginTop:3}}>{5-weeksInPhase} week{5-weeksInPhase!==1?"s":""} until eligible</div>}
              </div>
            </div>

            {/* Phase pills */}
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:20}}>
              {PHASES.map(ph=>{
                const active=ph.id===phaseState.currentPhase;
                const isForward=ph.id>phaseState.currentPhase;
                const isLocked=isForward&&!canComplete;
                const isNext=ph.id===nextPhaseId&&!active;
                return(
                  <div key={ph.id}
                    className={active?"phase-pill-active":isLocked?"phase-pill-locked":"phase-pill-clickable"}
                    onClick={()=>{if(active||isLocked)return;if(isForward&&isNext)setCompleteModal(true);else switchPhaseManual(ph.id)}}
                    style={{border:`1px solid ${active?"#e8c84a":isLocked?"#2a2820":isNext?"#3a7a3a":"#2a2820"}`,borderRadius:6,padding:"14px 16px",background:active?"#1a1710":isLocked?"#0e0e0d":"transparent"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                      <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:14,color:active?"#e8c84a":isLocked?"#2a2820":"#6a6560",letterSpacing:1}}>PHASE {ph.id}</div>
                      {active&&<span style={{fontSize:9,background:"#e8c84a",color:"#0d0d0d",borderRadius:3,padding:"2px 6px",letterSpacing:1,fontWeight:700}}>ACTIVE</span>}
                      {isLocked&&<span style={{fontSize:9,color:"#3a3530",letterSpacing:1}}>🔒 {5-weeksInPhase}w</span>}
                      {isNext&&canComplete&&<span style={{fontSize:9,color:"#4a8a4a",letterSpacing:1}}>READY</span>}
                    </div>
                    <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:18,color:active?"#fff":isLocked?"#2a2820":"#5a5550",letterSpacing:1,marginBottom:4}}>{ph.name}</div>
                    <div style={{fontSize:10,color:isLocked?"#2a2820":"#4a4540",lineHeight:1.5}}>{ph.description}</div>
                  </div>
                );
              })}
            </div>

            {/* Complete phase CTA */}
            {canComplete&&(
              <div style={{marginBottom:20,padding:"14px 18px",background:"#0d1a0d",border:"1px solid #2a5a2a",borderRadius:6,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:12}}>
                <div>
                  <div style={{fontSize:12,color:"#70e870",letterSpacing:1}}>Phase {curPhaseObj.id} eligible for completion</div>
                  <div style={{fontSize:10,color:"#4a6a4a",marginTop:3}}>Peak weights will be captured · opening weights auto-set at {Math.round(resetPct*100)}%</div>
                </div>
                <button onClick={()=>setCompleteModal(true)}
                  style={{background:"#4a9a4a",border:"none",color:"#fff",padding:"10px 20px",borderRadius:4,fontSize:11,letterSpacing:2,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>
                  COMPLETE PHASE →
                </button>
              </div>
            )}

            {/* Phase history */}
            {phaseState.transitions.length>0&&(
              <div>
                <div style={{fontSize:9,letterSpacing:3,color:"#2a2820",marginBottom:10}}>PHASE HISTORY</div>
                {[...phaseState.transitions].reverse().slice(0,8).map((t,i)=>{
                  const wkLabel=isoWeekShort(t.date);
                  const reasonLabel=t.reason==="completed"?"completed":t.reason==="auto-stall"?"stalled":"manual";
                  return(
                    <div key={i} style={{display:"flex",gap:12,alignItems:"center",fontSize:11,color:"#4a4540",marginBottom:5,flexWrap:"wrap"}}>
                      <span style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:13,color:"#3a3530",letterSpacing:1,minWidth:72}}>{wkLabel}</span>
                      <span>Phase {t.from} → Phase {t.to}</span>
                      <span style={{fontSize:9,color:t.reason==="completed"?"#4a8a4a":t.reason==="auto-stall"?"#8a4040":"#3a3530",border:"1px solid currentColor",borderRadius:3,padding:"1px 6px",letterSpacing:1}}>{reasonLabel}</span>
                      {t.peaks&&Object.keys(t.peaks).length>0&&(
                        <span style={{fontSize:9,color:"#3a3530"}}>
                          peaks: {DEFAULT_PROG.map(l=>t.peaks[l.id]?`${l.id.slice(0,3)} ${t.peaks[l.id]}kg`:"").filter(Boolean).join(" · ")}
                        </span>
                      )}
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          {/* Lift table — now with LOAD % column */}
          <div style={{background:"#111",border:"1px solid #1a1815",borderRadius:8,marginBottom:24,overflowX:"auto"}}>
            <div style={{minWidth:660}}>
              <div style={{display:"grid",gridTemplateColumns:"1.4fr 1fr 1fr 1fr 1fr 1fr",padding:"11px 20px",fontSize:9,letterSpacing:3,color:"#3a3530",borderBottom:"1px solid #1a1815",background:"#0e0e0c"}}>
                <span>LIFT</span><span style={{textAlign:"center"}}>LAST LOGGED</span><span style={{textAlign:"center"}}>THIS WEEK</span><span style={{textAlign:"center"}}>LOAD %</span><span style={{textAlign:"center"}}>NEXT WEEK</span><span style={{textAlign:"center"}}>STATUS</span>
              </div>
              {progData.map((lift,idx)=>{
                const stallCount=phaseState.stallCounts[lift.id]||0,stallTriple=stallCount>=3||lift.stalledWeeks>=3;
                const lp=lift.loadPct;
                const lpColor=lp===null?"#3a3530":lp>=100?"#4a9a4a":lp>=85?"#e8c84a":"#e87070";
                return(
                  <div key={lift.id} style={{borderBottom:idx<progData.length-1?"1px solid #161410":"none"}}>
                    <div style={{display:"grid",gridTemplateColumns:"1.4fr 1fr 1fr 1fr 1fr 1fr",padding:"16px 20px",alignItems:"center",background:idx%2===0?"#111":"#0f0f0d"}}>
                      <div>
                        <div style={{fontSize:14,color:"#fff",marginBottom:2}}>{lift.label}</div>
                        <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
                          {lift.startWeekKey&&<span style={{fontSize:10,color:"#3a3530"}}>+{lift.increment}kg/wk</span>}
                          {stallCount>0&&<span style={{fontSize:10,color:stallTriple?"#e87070":"#8a7060"}}>{stallTriple?"⚠":"·"} stalls:{stallCount}</span>}
                        </div>
                        {!lift.hasData&&<div style={{fontSize:10,color:"#4a4540",marginTop:3}}>Log this lift to begin</div>}
                      </div>
                      {/* Last logged */}
                      <div style={{textAlign:"center"}}>
                        {lift.lastLoggedWeight
                          ?<><div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:22,color:"#7a7570",letterSpacing:1,lineHeight:1}}>{lift.lastLoggedWeight}<span style={{fontSize:11,color:"#4a4540"}}> kg</span></div>
                            <div style={{fontSize:10,color:"#3a3530",marginTop:2}}>{lift.lastLoggedWeek}</div></>
                          :<span style={{color:"#2a2820"}}>—</span>}
                      </div>
                      {/* This week prescribed */}
                      <div style={{textAlign:"center"}}>
                        {lift.prescribedWeight
                          ?<><div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:26,letterSpacing:1,lineHeight:1,color:lift.thisWeekActual?(lift.thisWeekActual>=lift.prescribedWeight?"#4a9a4a":"#e8c84a"):"#e8c84a"}}>{lift.prescribedWeight}<span style={{fontSize:12,color:"#5a5550"}}> kg</span></div>
                            {lift.thisWeekActual
                              ?<div style={{fontSize:10,color:lift.thisWeekActual>=lift.prescribedWeight?"#4a7a4a":"#7a6030",marginTop:2}}>logged {lift.thisWeekActual}kg {lift.thisWeekActual>=lift.prescribedWeight?"✓":"↓"}</div>
                              :<div style={{fontSize:10,color:"#3a3530",marginTop:2}}>{todayIsoWk} · pending</div>}</>
                          :<span style={{color:"#2a2820"}}>—</span>}
                      </div>
                      {/* Load % */}
                      <div style={{textAlign:"center"}}>
                        {lp!==null
                          ?<div>
                            <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:26,color:lpColor,letterSpacing:1,lineHeight:1}}>{lp}<span style={{fontSize:12,color:"#5a5550"}}>%</span></div>
                            <div style={{marginTop:5,height:4,background:"#1a1815",borderRadius:2,overflow:"hidden",width:48,margin:"5px auto 0"}}>
                              <div style={{height:"100%",width:`${Math.min(lp,100)}%`,background:lpColor,borderRadius:2,transition:"width .3s"}}/>
                            </div>
                          </div>
                          :<span style={{color:"#2a2820"}}>—</span>}
                      </div>
                      {/* Next week */}
                      <div style={{textAlign:"center"}}>
                        {lift.nextWeight?<div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:22,color:"#5a6a5a",letterSpacing:1}}>{lift.nextWeight}<span style={{fontSize:11,color:"#4a4540"}}> kg</span></div>:<span style={{color:"#2a2820"}}>—</span>}
                      </div>
                      {/* Status */}
                      <div style={{textAlign:"center"}}>
                        <div style={{display:"flex",flexDirection:"column",gap:5,alignItems:"center"}}>
                          {lift.stalled||stallTriple
                            ?<span style={{display:"inline-block",background:"#2a1010",border:"1px solid #8b2222",color:"#e87070",borderRadius:4,padding:"4px 8px",fontSize:10,letterSpacing:1}}>⚠ STALLED</span>
                            :lift.thisWeekActual&&lift.prescribedWeight&&lift.thisWeekActual>=lift.prescribedWeight
                              ?<span style={{display:"inline-block",background:"#0d1f0d",border:"1px solid #2a7a2a",color:"#70e870",borderRadius:4,padding:"4px 8px",fontSize:10,letterSpacing:1}}>✓ ON TRACK</span>
                              :lift.hasData
                                ?<span style={{display:"inline-block",background:"#1a1815",border:"1px solid #2a2820",color:"#5a5550",borderRadius:4,padding:"4px 8px",fontSize:10,letterSpacing:1}}>PENDING</span>
                                :<span style={{display:"inline-block",background:"1a1815",border:"1px solid #2a2820",color:"#3a3530",borderRadius:4,padding:"4px 8px",fontSize:10,letterSpacing:1}}>NO DATA</span>
                          }
                          <button className="stall-btn" onClick={()=>bumpStall(lift.id)}>+ stall</button>
                        </div>
                      </div>
                    </div>
                    {lift.history.length>1&&(
                      <div style={{padding:"0 20px 14px",display:"flex",gap:4,alignItems:"flex-end",height:32}}>
                        <span style={{fontSize:9,color:"#2a2820",letterSpacing:2,marginRight:8,whiteSpace:"nowrap",paddingBottom:2}}>8W</span>
                        {lift.history.map((h,i)=>{const mw=Math.max(...lift.history.map(x=>x.weight));return<div key={i} title={`${h.wk}: ${h.weight} kg`} style={{flex:1,background:"#252220",height:`${Math.max(mw>0?(h.weight/mw)*100:0,15)}%`,borderRadius:"2px 2px 0 0",minWidth:8,maxWidth:32}}/>;  })}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>

          {/* Phase peaks history */}
          {phaseState.peakWeights&&Object.keys(phaseState.peakWeights).length>0&&(
            <div style={{background:"#111",border:"1px solid #1a1815",borderRadius:8,padding:20,marginBottom:24}}>
              <div style={{fontSize:10,letterSpacing:3,color:"#3a3530",marginBottom:4}}>PHASE PEAK WEIGHTS</div>
              <div style={{fontSize:11,color:"#4a4540",marginBottom:16}}>Highest working set logged per phase at completion.</div>
              <div style={{overflowX:"auto"}}>
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:12,minWidth:320}}>
                  <thead>
                    <tr style={{borderBottom:"1px solid #1a1815"}}>
                      <th style={{textAlign:"left",padding:"6px 12px 10px 0",fontSize:9,letterSpacing:3,color:"#3a3530",fontWeight:"normal"}}>PHASE</th>
                      {DEFAULT_PROG.map(l=><th key={l.id} style={{textAlign:"center",padding:"6px 12px 10px",fontSize:9,letterSpacing:3,color:"#3a3530",fontWeight:"normal"}}>{l.label.toUpperCase()}</th>)}
                    </tr>
                  </thead>
                  <tbody>
                    {Object.entries(phaseState.peakWeights).sort(([a],[b])=>a-b).map(([phId,peaks])=>{
                      const ph=PHASES.find(p=>p.id===parseInt(phId));
                      return(
                        <tr key={phId} style={{borderBottom:"1px solid #161410"}}>
                          <td style={{padding:"10px 12px 10px 0",color:"#8a8075"}}>Phase {phId}: {ph?.name||""}</td>
                          {DEFAULT_PROG.map(l=><td key={l.id} style={{textAlign:"center",padding:"10px 12px",fontFamily:"'Bebas Neue',sans-serif",fontSize:18,color:peaks[l.id]?"#e8c84a":"#2a2820",letterSpacing:.5}}>{peaks[l.id]?`${peaks[l.id]} kg`:"—"}</td>)}
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* Set starting weight (manual override) */}
          <div style={{background:"#111",border:"1px solid #1a1815",borderRadius:8,padding:20}}>
            <div style={{fontSize:10,letterSpacing:3,color:"#3a3530",marginBottom:4}}>MANUAL STARTING WEIGHT OVERRIDE</div>
            <div style={{fontSize:11,color:"#4a4540",marginBottom:18}}>Overrides the auto-calculated opening weight. Use if the phase reset calculation needs correction.</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12}}>
              {progData.map(lift=>(
                <div key={lift.id}>
                  <div style={{fontSize:10,color:"#5a5550",letterSpacing:1,marginBottom:8}}>{lift.label}</div>
                  <div style={{display:"flex",gap:8,alignItems:"center"}}>
                    <input type="number" placeholder={lift.startWeight?String(lift.startWeight):"kg"} step="0.5"
                      onBlur={e=>{const v=parseFloat(e.target.value);if(!v)return;const nsw={...startWeights,[lift.id]:{weight:v,weekStart:isoWeek(todaySyd())}};setStartWeights(nsw);saveProg(nsw,progCfg);flash2(`Override set: ${lift.label}`);e.target.value=""}}
                      style={{width:"100%",background:"transparent",border:"1px solid #2a2820",borderRadius:4,color:"#e8e0d5",fontSize:14,padding:"8px 10px"}}/>
                    <span style={{fontSize:12,color:"#4a4540"}}>kg</span>
                  </div>
                  {lift.startWeight&&<div style={{fontSize:10,color:"#3a3530",marginTop:5}}>Current: {lift.startWeight} kg · {lift.startWeekKey}</div>}
                </div>
              ))}
            </div>
          </div>
        </>}

      </div>{/* /content */}

      {/* ── Day Picker Modal ── */}
      {dayModal&&(()=>{
        const tmpls=PHASE_TEMPLATES[phaseState.currentPhase]||[];
        return<>
          <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.82)",zIndex:400,display:"flex",alignItems:"center",justifyContent:"center",padding:"16px"}} onClick={()=>setDayModal(false)}>
          <div className="fade-in" onClick={e=>e.stopPropagation()} style={{background:"#161410",border:"1px solid #2a2820",borderRadius:8,width:"min(520px,100%)",display:"flex",flexDirection:"column",boxShadow:"0 24px 64px rgba(0,0,0,.95)",maxHeight:"90vh"}}>
            <div style={{padding:"20px 22px 16px",borderBottom:"1px solid #1a1815",flexShrink:0,display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div>
                <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:24,letterSpacing:2,color:"#e8c84a",lineHeight:1}}>START WORKOUT</div>
                <div style={{fontSize:10,color:"#3a3530",letterSpacing:2,marginTop:5}}>PHASE {phaseState.currentPhase}: {curPhaseObj.name} · {todayIsoWk}</div>
              </div>
              <span onClick={()=>setDayModal(false)} style={{fontSize:26,color:"#5a5550",cursor:"pointer",padding:"2px 8px",lineHeight:1}}>×</span>
            </div>
            <div style={{overflowY:"auto",flex:1,padding:"14px 16px 20px",display:"flex",flexDirection:"column",gap:10}}>
              {tmpls.map(tmpl=>{
                const alreadyLogged=entries.some(e=>e.date===formDate&&tmpl.exercises.some(ex=>ex.name===e.exercise));
                return(
                  <DayCard key={tmpl.day} tmpl={tmpl} alreadyLogged={alreadyLogged}
                    tmplWeight={tmplWeight}
                    onStart={()=>{setDayModal(false);setGuided({template:tmpl})}}/>
                );
              })}
            </div>
          </div>
          </div>
        </>;
      })()}

      {/* ── Guided Workout ── */}
      {guided&&(
        <GuidedWorkout
          template={guided.template}
          progData={progData}
          formDate={formDate}
          entries={entries}
          onSave={newEntries=>{
            const merged=[...entries,...newEntries];
            setEntries(merged);saveEntries(merged);
            setGuided(null);
            flash2(`Workout saved — ${newEntries.length} sets logged`);
          }}
          onClose={()=>setGuided(null)}
        />
      )}

      {/* ── Complete Phase Modal ── */}
      {completeModal&&(
        <CompletePhaseModal
          curPhase={curPhaseObj}
          nextPhase={nextPhaseObj}
          peakWeights={peakWeightsNow}
          resetPct={resetPct}
          weeksInPhase={weeksInPhase}
          onConfirm={confirmCompletePhase}
          onClose={()=>setCompleteModal(false)}
        />
      )}

      {/* ── Obsidian Export Modal ── */}
      {obsModal&&<>
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.75)",zIndex:400,display:"flex",alignItems:"center",justifyContent:"center",padding:"16px"}} onClick={()=>setObsModal(false)}>
        <div onClick={e=>e.stopPropagation()} style={{background:"#161410",border:"1px solid #2a4a2a",borderRadius:8,padding:28,width:"min(680px,100%)",maxHeight:"85vh",display:"flex",flexDirection:"column",boxShadow:"0 24px 64px rgba(0,0,0,.9)"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
            <div>
              <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:22,letterSpacing:2,color:"#4a9a4a"}}>OBSIDIAN EXPORT</div>
              <div style={{fontSize:10,color:"#3a5a3a",letterSpacing:2,marginTop:3}}>{obsWeek} · MARKDOWN FORMAT</div>
            </div>
            <span onClick={()=>setObsModal(false)} style={{fontSize:22,color:"#5a5550",cursor:"pointer"}}>×</span>
          </div>
          <div style={{fontSize:11,color:"#6a6560",marginBottom:12,lineHeight:1.7}}>
            Copy and paste into a new <strong style={{color:"#9a9590"}}>.md</strong> note in Obsidian. The <strong style={{color:"#9a9590"}}>Observations</strong> and <strong style={{color:"#9a9590"}}>Notes</strong> fields are left blank for you to fill in.
          </div>
          <textarea readOnly value={obsContent} onFocus={e=>e.target.select()} onClick={e=>e.target.select()}
            style={{flex:1,minHeight:260,background:"#0d0d0d",border:"1px solid #2a2820",borderRadius:4,color:"#a8a09a",fontSize:11,padding:"12px 14px",fontFamily:"monospace",resize:"none",lineHeight:1.5}}/>
          <div style={{display:"flex",gap:10,marginTop:16}}>
            <button onClick={()=>navigator.clipboard.writeText(obsContent).then(()=>{flash2("Copied!");setObsModal(false)}).catch(()=>flash2("Copy the text above manually.","error"))}
              style={{flex:1,background:"#4a9a4a",border:"none",color:"#fff",padding:"11px",borderRadius:4,fontSize:11,letterSpacing:2,fontWeight:700,cursor:"pointer"}}>
              COPY TO CLIPBOARD
            </button>
            <button onClick={()=>setObsModal(false)} style={{background:"transparent",border:"1px solid #2a2820",color:"#5a5550",padding:"11px 20px",borderRadius:4,fontSize:11,cursor:"pointer"}}>CLOSE</button>
          </div>
        </div>
        </div>
      </>}

      {/* ── CSV Modal ── */}
      {csvModal&&<>
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.75)",zIndex:400,display:"flex",alignItems:"center",justifyContent:"center",padding:"16px"}} onClick={()=>setCsvModal(false)}>
        <div onClick={e=>e.stopPropagation()} style={{background:"#161410",border:"1px solid #2a2820",borderRadius:8,padding:28,width:"min(640px,100%)",maxHeight:"80vh",display:"flex",flexDirection:"column",boxShadow:"0 24px 64px rgba(0,0,0,.9)"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
            <div>
              <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:22,letterSpacing:2,color:"#e8c84a"}}>EXPORT DATA</div>
              <div style={{fontSize:10,color:"#3a3530",letterSpacing:2,marginTop:3}}>{entries.length} ENTRIES · CSV FORMAT</div>
            </div>
            <span onClick={()=>setCsvModal(false)} style={{fontSize:22,color:"#5a5550",cursor:"pointer"}}>×</span>
          </div>
          <div style={{fontSize:11,color:"#6a6560",marginBottom:14,lineHeight:1.7}}>
            Select all text, copy, then paste into a <strong style={{color:"#9a9590"}}>.txt file</strong> → save as <strong style={{color:"#9a9590"}}>iron-log.csv</strong>, or paste directly into Google Sheets / Excel.
          </div>
          <textarea readOnly value={csvContent} onFocus={e=>e.target.select()} onClick={e=>e.target.select()}
            style={{flex:1,minHeight:220,background:"#0d0d0d",border:"1px solid #2a2820",borderRadius:4,color:"#a8a09a",fontSize:11,padding:"12px 14px",fontFamily:"monospace",resize:"none",lineHeight:1.5}}/>
          <div style={{display:"flex",gap:10,marginTop:16}}>
            <button onClick={()=>navigator.clipboard.writeText(csvContent).then(()=>{flash2("Copied!");setCsvModal(false)}).catch(()=>flash2("Copy the text above manually.","error"))}
              style={{flex:1,background:"#e8c84a",border:"none",color:"#0d0d0d",padding:"11px",borderRadius:4,fontSize:11,letterSpacing:2,fontWeight:700,cursor:"pointer"}}>
              COPY TO CLIPBOARD
            </button>
            <button onClick={()=>setCsvModal(false)} style={{background:"transparent",border:"1px solid #2a2820",color:"#5a5550",padding:"11px 20px",borderRadius:4,fontSize:11,cursor:"pointer"}}>CLOSE</button>
          </div>
        </div>
        </div>
      </>}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
